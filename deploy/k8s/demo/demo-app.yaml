# Shared demo topology (Appendix A6). Generated layout: one Deployment + Service per demo service.
#   gateway -> order-svc -> (parallel) inventory-svc, payment-svc, loyalty-svc (optional), legacy-svc (optional) -> shipping-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: rpe-demo
  labels: {app: gateway, app.kubernetes.io/part-of: rpe-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations:
        resilience.rpe.dev/role: gateway
        # the gateway sidecar starts every chain with these budgets (same as ROUTE_BUDGETS of the app below);
        # the active Component 3 policy overrides them per route
        resilience.rpe.dev/route-deadlines: "GET /api/orders=1000;POST /api/orders=2000"
    spec:
      containers:
        - name: app
          image: rpe/demo-app:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: SERVICE_NAME, value: gateway}
            - {name: ROLE, value: gateway}
            - {name: ROUTE_BUDGETS, value: "GET /api/orders=1000;POST /api/orders=2000"}
            - {name: DEFAULT_BUDGET_MS, value: "1000"}
            - {name: RETRY_BUDGET, value: "3"}
            - {name: POLICY_EPOCH, value: "e0"}
            # follow the policy the gateway's sidecar enforces (active epoch and route deadlines)
            - {name: POLICY_FOLLOW_URL, value: "http://127.0.0.1:15020/rpe/v1/policy/active"}
            - {name: CHILDREN, value: "order=http://order-svc:8080/orders"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: rpe-demo
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-svc
  namespace: rpe-demo
  labels: {app: order-svc, app.kubernetes.io/part-of: rpe-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-svc}
  template:
    metadata:
      labels: {app: order-svc}
      annotations: {}
    spec:
      containers:
        - name: app
          image: rpe/demo-app:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: SERVICE_NAME, value: order-svc}
            - {name: CHILDREN, value: "inventory=http://inventory-svc:8080/reserve,payment=http://payment-svc:8080/pay,loyalty=http://loyalty-svc:8080/award?optional,legacy=http://legacy-svc:8080/ship?optional"}
            - {name: FANOUT, value: partial}
            - {name: SPLIT_MODE, value: parallel}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: order-svc
  namespace: rpe-demo
spec:
  selector: {app: order-svc}
  ports: [{port: 8080, targetPort: 8080, name: http}]
