          env:
            - {name: SERVICE_NAME, value: payment-svc}
            - {name: SIDE_EFFECT, value: cards_charged}
            # a payment provider call takes ~120-140 ms, so chain latency is realistic for deadline tuning
            - {name: BASE_LATENCY_MS, value: "120"}
            - {name: BASE_JITTER_MS, value: "20"}
          readinessProbe:
