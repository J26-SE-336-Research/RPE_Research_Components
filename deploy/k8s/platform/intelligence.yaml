# C4: Resilience Intelligence Layer. Live mode: analyses Prometheus (sidecar metrics) and Tempo (gateway traces),
# keeps every recommendation pending until a human approves it, and delivers approved ones to the C3 policy API.
# The demo cluster uses a 1-minute window and a 15-second cycle so live recommendations appear within minutes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpe-intelligence
  namespace: rpe-system
  labels: {app: rpe-intelligence, app.kubernetes.io/part-of: rpe}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rpe-intelligence}
  template:
    metadata:
      labels: {app: rpe-intelligence}
    spec:
      containers:
        - name: intelligence
          image: rpe/intelligence:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8090, name: http}]
          env:
            - {name: PROMETHEUS_COLLECTION_ENABLED, value: "true"}
            - {name: PROMETHEUS_URL, value: "http://rpe-prometheus.rpe-system:9090"}
            - {name: TEMPO_URL, value: "http://rpe-tempo.rpe-system:3200"}
            - {name: RRPE_CONNECTIONS_NAMESPACE, value: rpe-demo}
            - {name: RRPE_CONNECTIONS_SERVICES, value: "gateway,order-svc,inventory-svc,payment-svc,loyalty-svc,shipping-svc,fraud-check-svc"}
            - {name: RRPE_CONNECTIONS_GATEWAYSERVICE, value: gateway}
            - {name: RRPE_CONNECTIONS_SCRAPEINTERVAL, value: 5s}
            - {name: RRPE_CONNECTIONS_TRACELIMIT, value: "2000"}
            - {name: RRPE_ADAPTIVE_WINDOW, value: 1m}
            - {name: RRPE_ADAPTIVE_CYCLE, value: 15s}
            # Tempo makes a trace searchable ~10 s after it ends; evaluate windows that ended 20 s ago
            - {name: RRPE_ADAPTIVE_EVALUATION_DELAY, value: 20s}
            - {name: RRPE_ADAPTIVE_BASELINESAMPLES, value: "5"}
            - {name: RRPE_ADAPTIVE_COOLDOWN, value: 1m}
            # Deadline recommendation v2, demo-cluster values (guide §8.3); production defaults are in AdaptiveConfig.DeadlineSettings
            - {name: RRPE_ADAPTIVE_DEADLINE_MINLEARNINGWINDOWS, value: "3"}
            - {name: RRPE_ADAPTIVE_DEADLINE_MINLEARNINGREQUESTS, value: "150"}
            - {name: RRPE_ADAPTIVE_DEADLINE_PERSISTENCEWINDOWS, value: "2"}
            - {name: RRPE_ADAPTIVE_DEADLINE_MAXWIDEN, value: 5m}
            - {name: RRPE_ADAPTIVE_DEADLINE_MAXPROPOSALSPERHOUR, value: "6"}
            - {name: RRPE_ADAPTIVE_DEADLINE_DRIFTWINDOWS, value: "2"}
            - {name: RRPE_ADAPTIVE_DEADLINE_COVERAGEMINSAMPLES, value: "10"}
            # Rate and retry v2, demo-cluster values; production defaults are in AdaptiveConfig.RateSettings / AutoSettings.
            # Rate and retry changes in this list are approved automatically (reviewer c4-auto) by the safety guard;
            # chain deadlines are never approved automatically. Retry increases stay advisory until C2 counts retries (PP2).
            # rates and retries never wait for a person (22 Oct): changes the guard refuses are held and tried again every cycle
            - {name: RRPE_ADAPTIVE_AUTOAPPROVEACTIONS, value: "BUCKET_RAISE,BUCKET_CUT,BUCKET_RELAX,RETRY_DECREASE,RETRY_INCREASE"}
            - {name: RRPE_ADAPTIVE_RATE_MAXABSOLUTE, value: "500"}
            # what the app managed when it slowed down is remembered this long (6h in code; short for a live demo)
            - {name: RRPE_ADAPTIVE_RATE_BROKEATMEMORY, value: 10m}
            - {name: RRPE_ADAPTIVE_RATE_STABILISATION, value: 1m}
            - {name: RRPE_ADAPTIVE_BASELINE_ALLOWSHEDWINDOWS, value: "true"}
            # Rate learning fix: provisional P0 while the queue is full after this many windows (5 in code), and the history
            # of learning windows with their load for "P0 from the quietest windows" (60 in code; 40 x 15 s = 10 min)
            - {name: RRPE_ADAPTIVE_BASELINE_PROVISIONALWINDOWS, value: "3"}
            - {name: RRPE_ADAPTIVE_BASELINE_LOADWINDOWS, value: "40"}
            # "app time grows with load" over the last N learning windows (6 in code; the same here, fewer gives false alarms)
            - {name: RRPE_ADAPTIVE_RATE_LOADGROWTHWINDOWS, value: "6"}
            - {name: RRPE_ADAPTIVE_AUTO_PAUSE, value: 10m}
            - {name: RRPE_ADAPTIVE_AUTO_PERIOD, value: 10m}
            # lowering a too-generous rate starts after this wait (30m in code; short for a live demo)
            - {name: RRPE_ADAPTIVE_RATE_GENEROUSWAIT, value: 2m}
            # Joint healthy recalibration (C3 request): rate + chain deadline in one decision, always approved by a person.
            - {name: RRPE_ADAPTIVE_JOINT_ENABLED, value: "true"}
            - {name: RRPE_DELIVERY_POLL, value: 5s}
            - {name: COMPONENT3_POLICY_URL, value: "http://rpe-policy-api.rpe-system"}
            - name: RRPE_CONTROL_TOKEN
              valueFrom: {secretKeyRef: {name: rpe-control-token, key: token}}
            - {name: RPE_AUDIT_JDBC_URL, value: "jdbc:postgresql://rpe-postgres.rpe-system:5432/rpe"}
            - {name: RPE_AUDIT_USER, value: rpe}
            - {name: RPE_AUDIT_PASSWORD, value: rpe-dev-password}
            # synthetic scenarios stay available for the simulation tab; they are never delivered
            - {name: RRPE_MOCK_ENABLED, value: "true"}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70"}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8090}
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rpe-intelligence
  namespace: rpe-system
spec:
  selector: {app: rpe-intelligence}
  ports: [{port: 8090, targetPort: 8090, name: http}]
