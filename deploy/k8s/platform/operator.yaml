# C3: RPE Operator + policy API. Least privilege: RPE custom resources in rpe-system; pods and namespaces read
# cluster-wide for the coverage audit (namespaces labelled rpe-injection=enabled), and pod delete only for the
# admin "re-inject" action that recreates a pod which runs without the sidecar.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rpe-operator
  namespace: rpe-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rpe-operator
  namespace: rpe-system
rules:
  - apiGroups: [resilience.rpe.dev]
    resources: [rpepolicies, rperollouts]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [resilience.rpe.dev]
    resources: [rpepolicies/status, rperollouts/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rpe-operator
  namespace: rpe-system
subjects: [{kind: ServiceAccount, name: rpe-operator, namespace: rpe-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rpe-operator}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rpe-operator-fleet
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rpe-operator-fleet
subjects: [{kind: ServiceAccount, name: rpe-operator, namespace: rpe-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rpe-operator-fleet}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpe-operator
  namespace: rpe-system
  labels: {app: rpe-operator, app.kubernetes.io/part-of: rpe}
spec:
  replicas: 1
  selector:
    matchLabels: {app: rpe-operator}
  template:
    metadata:
      labels: {app: rpe-operator}
    spec:
      serviceAccountName: rpe-operator
      containers:
        - name: operator
          image: rpe/operator:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 8081, name: metrics}
          env:
            - {name: DATABASE_URL, value: "postgres://rpe:rpe-dev-password@rpe-postgres.rpe-system:5432/rpe?sslmode=disable"}
            - {name: REDIS_ADDR, value: "rpe-redis.rpe-system:6379"}
            - {name: DEMO_NAMESPACE, value: rpe-demo}
            - {name: DRAIN_MAX_MS, value: "30000"}     # longest wait for requests pinned to the previous epoch
            - {name: SETTLE_MS, value: "3000"}         # final mixed-policy count after a rollout completes
            - {name: DRIFT_INTERVAL_MS, value: "5000"} # coverage audit + drift repair period
            - {name: AUTO_ROLLOUT, value: "false"}     # rollouts are started explicitly from the admin panel
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 192Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: rpe-policy-api
  namespace: rpe-system
spec:
  selector: {app: rpe-operator}
  ports:
    - {port: 80, targetPort: 8080, name: http}
    - {port: 8081, targetPort: 8081, name: metrics}
