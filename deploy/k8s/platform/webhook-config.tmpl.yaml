apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: rpe-sidecar-injector
webhooks:
  - name: sidecar-injector.rpe.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    # Fail gives predictable results in tests. Experiment E2 (webhook safety) compares it with Ignore.
    failurePolicy: Fail
    reinvocationPolicy: Never
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels: {rpe-injection: enabled}
    rules:
      - operations: [CREATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
    clientConfig:
      service:
        name: rpe-admission-webhook
        namespace: rpe-system
        path: /mutate
      caBundle: ${CA_BUNDLE}
