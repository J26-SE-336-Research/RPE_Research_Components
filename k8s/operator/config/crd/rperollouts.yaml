apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rperollouts.resilience.rpe.dev
spec:
  group: resilience.rpe.dev
  scope: Namespaced
  names:
    kind: RPERollout
    listKind: RPERolloutList
    plural: rperollouts
    singular: rperollout
    shortNames: [rper]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Policy, type: string, jsonPath: .spec.policyId}
        - {name: Epoch, type: string, jsonPath: .spec.epoch}
        - {name: Mode, type: string, jsonPath: .spec.mode}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Active, type: integer, jsonPath: .status.active}
        - {name: Targets, type: integer, jsonPath: .status.targetPods}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [policyId, version, epoch, service, mode]
              properties:
                policyId: {type: string}
                version: {type: integer, minimum: 1}
                epoch: {type: string}
                service: {type: string}
                mode: {type: string, enum: [two-phase, naive]}
                previousEpoch: {type: string}
                requestedBy: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                targetPods: {type: integer}
                staged: {type: integer}
                active: {type: integer}
                startedAt: {type: string}
                completedAt: {type: string}
                drainUntil: {type: string}
                attempts: {type: integer}
                pods:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      service: {type: string}
                      role: {type: string}
                      state: {type: string}
                      error: {type: string}
