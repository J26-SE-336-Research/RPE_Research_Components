spring.application.name=resilience-intelligence-layer
server.port=8090

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Corrected adaptive implementation. Legacy v1 endpoints are retained for old fixtures only.
rrpe.connections.collect=${PROMETHEUS_COLLECTION_ENABLED:false}
rrpe.connections.prometheus-url=${PROMETHEUS_URL:http://localhost:9090}
rrpe.connections.tempo-url=${TEMPO_URL:http://localhost:3200}
rrpe.connections.component3-url=${COMPONENT3_POLICY_URL:}
rrpe.connections.component3-token=${COMPONENT3_POLICY_TOKEN:}
rrpe.delivery.deadline-url=${COMPONENT3_DEADLINE_URL:}
rrpe.delivery.leaky-bucket-url=${COMPONENT3_LEAKY_BUCKET_URL:}
rrpe.delivery.retry-budget-url=${COMPONENT3_RETRY_BUDGET_URL:}
rrpe.control-token=${RRPE_CONTROL_TOKEN:}
rrpe.mock-enabled=${RRPE_MOCK_ENABLED:false}
